plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = "com.${mod_id}"
base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com/' } }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter {
            includeGroup('curse.maven')
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    implementation "curse.maven:lootr-361276:8968561"
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var expandProps = [
            'version'                      : version,
            'minecraft_version_range'      : '[1.21.1,1.22)',
            'neoforge_loader_version_range': '[4,)',
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_license'                  : 'All Rights Reserved',
            'mod_description'              : mod_description
    ]
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author
        ])
    }
}

if (file('dev.gradle').exists())
    apply from: 'dev.gradle'
